# Separate SoulNest stack; does not manage the root Rydex Blueprint.
services:
  - type: web
    name: soulnest-mvp
    runtime: node
    rootDir: ai-platform
    region: oregon
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run typecheck -w @aiplatform/api && npm run build -w @aiplatform/companion-web
    startCommand: npm run soulnest:start
    healthCheckPath: /api/soulnest/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: soulnest-mvp-db
          property: connectionString
      - key: SOULNEST_API_ORIGIN
        value: http://127.0.0.1:4000
      - key: SOULNEST_EMAIL_PROVIDER
        value: resend
      - key: SOULNEST_EMAIL_API_KEY
        sync: false
      - key: SOULNEST_EMAIL_FROM
        sync: false
      - key: AI_PROVIDER
        value: preview
      - key: FREE_DAILY_MESSAGES
        value: "30"
      - key: FREE_DAILY_VOICE
        value: "5"
databases:
  - name: soulnest-mvp-db
    region: oregon
    plan: 0.1c-256mb
    databaseName: soulnest
    user: soulnest
    ipAllowList: []
