# Separate SoulNest stack; does not manage the root Rydex Blueprint.
services:
  - type: web
    name: soulnest-mvp
    runtime: node
    rootDir: ai-platform
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run typecheck -w @aiplatform/api
    startCommand: npm start -w @aiplatform/api
    healthCheckPath: /v2/soulnest/health
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: soulnest-mvp-db
          property: connectionString
      - key: AI_PROVIDER
        value: preview
      - key: FREE_DAILY_MESSAGES
        value: "30"
      - key: FREE_DAILY_VOICE
        value: "5"
databases:
  - name: soulnest-mvp-db
    region: oregon
    plan: 0.1c-256mb
    databaseName: soulnest
    user: soulnest
    ipAllowList: []

