name: Rydex CI

on:
  pull_request:
  push:
    branches: [main, security-hardening-2]

jobs:
  web-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rydex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prisma schema validation
        run: npm run db:validate
      - name: Security tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
