name: SoulNest MVP
on:
  pull_request:
    paths: ['ai-platform/**', '.github/workflows/soulnest.yml']
  push:
    paths: ['ai-platform/**', '.github/workflows/soulnest.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: ai-platform/package-lock.json
      - run: npm ci
      - run: npm test -w @aiplatform/api
      - run: npm run typecheck -w @aiplatform/api
      - run: npm test -w @aiplatform/soulnest-mobile
      - run: npm run typecheck -w @aiplatform/soulnest-mobile
      - run: npx expo install --check
        working-directory: ai-platform/apps/soulnest-mobile
      - run: npm run export:android -w @aiplatform/soulnest-mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com/v2/soulnest
          EXPO_NO_TELEMETRY: '1'
      - run: npm run export:ios -w @aiplatform/soulnest-mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com/v2/soulnest
          EXPO_NO_TELEMETRY: '1'
      - run: npm run build -w @aiplatform/companion-web
      - run: npm run build -w @aiplatform/models-web
      - run: npm audit --omit=dev

