services:
  - type: web
    name: rydex
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: rydex-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PROVIDER_API_TOKEN
        generateValue: true
      - key: OTP_DEMO_MODE
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: rydex-db
    plan: free
    databaseName: rydex
    user: rydex
